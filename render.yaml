services:
  - type: web
    name: ai-observability-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0

  - type: pserv
    name: ai-observability-db
    runtime: docker
    plan: free
    docker:
      dockerfilePath: ./docker-compose.yml
